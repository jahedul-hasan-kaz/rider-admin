<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rider platform workflow</title>
<style>
  :root {
    --bg: #f6f8f7; --card: #ffffff; --ink: #12201a; --muted: #5b6b63; --line: #dfe6e2;
    --brand: #059669; --brand-soft: #d9f4e8;
    --built: #059669; --built-bg: #d9f4e8; --partial: #b45309; --partial-bg: #fdecc8; --nb: #b91c1c; --nb-bg: #fde0e0;
    --pax: #2563eb; --drv: #7c3aed; --sys: #0f766e; --adm: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1210; --card: #141c18; --ink: #e8f0ec; --muted: #93a39b; --line: #25322c;
      --brand: #34d399; --brand-soft: #0f3a2b;
      --built: #34d399; --built-bg: #0f3a2b; --partial: #fbbf24; --partial-bg: #3a2c08; --nb: #f87171; --nb-bg: #3d1414;
      --pax: #60a5fa; --drv: #a78bfa; --sys: #2dd4bf; --adm: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 20px 8px; max-width: 1040px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  .note { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--partial-bg); color: var(--ink); border: 1px solid var(--line); font-size: 14px; }
  nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .tabs { max-width: 1040px; margin: 0 auto; display: flex; gap: 4px; padding: 10px 20px; overflow-x: auto; }
  .tab { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 8px 16px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 18px; color: var(--muted); font-size: 13px; align-items: center; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.built { background: var(--built-bg); color: var(--built); }
  .badge.partial { background: var(--partial-bg); color: var(--partial); }
  .badge.not_built { background: var(--nb-bg); color: var(--nb); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; }
  /* timeline */
  .timeline { position: relative; margin: 0; padding: 0; list-style: none; }
  .timeline::before { content: ""; position: absolute; left: 21px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
  .step { position: relative; padding-left: 58px; margin-bottom: 14px; }
  .dot { position: absolute; left: 0; top: 6px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; box-shadow: 0 0 0 5px var(--bg); }
  .dot.passenger { background: var(--pax); } .dot.driver { background: var(--drv); } .dot.system { background: var(--sys); } .dot.admin { background: var(--adm); }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  summary::-webkit-details-marker { display: none; }
  summary .title { font-weight: 700; flex: 1 1 220px; }
  summary .who { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  summary .chev { color: var(--muted); transition: transform .15s; }
  details[open] summary .chev { transform: rotate(90deg); }
  .body { padding: 0 16px 16px; border-top: 1px dashed var(--line); }
  .body h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .body p { margin: 0; }
  .body ul { margin: 0; padding-left: 18px; }
  code { background: var(--brand-soft); color: var(--ink); padding: 2px 6px; border-radius: 6px; font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
  .box { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--brand-soft) 45%, var(--card)); font-size: 14px; }
  .box.warn { background: var(--partial-bg); }
  /* money */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  h2 { margin: 26px 0 6px; font-size: 18px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 8px; }
  .node { padding: 10px 14px; border-radius: 12px; font-weight: 700; color: #fff; text-align: center; font-size: 14px; }
  .arrow { color: var(--muted); font-size: 12px; text-align: center; max-width: 140px; }
  .ex { margin-bottom: 12px; }
  .ex dl { margin: 8px 0 0; display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 14px; }
  .ex dt { color: var(--muted); } .ex dd { margin: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); } th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .overview { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 20px; align-items: center; }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; }
  /* mind map: branches grow to the right; click a node to fold or unfold it */
  .mm-wrap { overflow: auto; padding: 8px 4px 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .mm { display: inline-block; min-width: 100%; padding: 16px; }
  .mm ul { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: flex; flex-direction: column; justify-content: center; }
  .mm ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; border-top: 2px solid var(--line); }
  .mm li { position: relative; padding: 4px 0 4px 14px; display: flex; align-items: center; }
  .mm li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
  .mm li:first-child::before { top: 50%; } .mm li:last-child::before { bottom: 50%; } .mm li:only-child::before { display: none; }
  .mm li::after { content: ""; position: absolute; left: 0; top: 50%; width: 14px; border-top: 2px solid var(--line); }
  .mm > ul { padding-left: 0; } .mm > ul::before { display: none; } .mm > ul > li { padding-left: 0; } .mm > ul > li::before, .mm > ul > li::after { display: none; }
  .mm .nd { display: flex; align-items: center; gap: 6px; max-width: 340px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; line-height: 1.35; text-align: left; font-family: inherit; color: var(--ink); }
  .mm .nd.has { cursor: pointer; font-weight: 600; } .mm .nd.has:hover { border-color: var(--brand); }
  .mm .d0 { background: var(--brand); border-color: var(--brand); color: #fff; font-size: 15px; font-weight: 700; padding: 10px 16px; }
  .mm .d1 { background: var(--sys); border-color: var(--sys); color: #fff; font-size: 14px; }
  .mm li[data-top="0"] > .nd.d1 { background: var(--pax); border-color: var(--pax); } .mm li[data-top="1"] > .nd.d1 { background: var(--drv); border-color: var(--drv); } .mm li[data-top="2"] > .nd.d1 { background: var(--adm); border-color: var(--adm); }
  .mm .d2 { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); background: var(--brand-soft); }
  .mm .lf { font-weight: 400; color: var(--muted); }
  .mm .tg { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 700; flex: none; }
  .mm .tg.built { background: var(--built-bg); color: var(--built); } .mm .tg.partial { background: var(--partial-bg); color: var(--partial); } .mm .tg.not_built { background: var(--nb-bg); color: var(--nb); }
  .mm .cv { opacity: .7; flex: none; transition: transform .15s; } .mm .open > .nd .cv { transform: rotate(90deg); }
  .exp { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
  .exp a { color: var(--brand); font-weight: 600; }
  @media (max-width: 560px) { .ex dl { grid-template-columns: 1fr; } .step { padding-left: 52px; } .dot { width: 38px; height: 38px; } .timeline::before { left: 18px; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="how"></p>
  <div class="note" id="important"></div>
</header>
<nav><div class="tabs" role="tablist" id="tabs"></div></nav>
<main id="main"></main>

<script id="data" type="application/json">{"title":"Rider platform: end-to-end workflow (passenger, driver, money)","version":"2026-11-09","currency":"BDT","how_to_read":"Each step says who does it, what happens, which API call does it, the rules the system enforces, and its status. All API paths are under /api/v1 and need the person's own sign-in token.","status_legend":{"built":"Works today in the backend (and admin panel where relevant).","partial":"The backend part exists; the mobile app screen or one piece of the behaviour does not.","not_built":"Not built yet; the note says what it would take."},"important":"The passenger and driver mobile apps are not built yet. Everything marked built is in the backend API and the admin panel; an app must call these APIs.","actors":{"passenger":"Books rides, pays the driver in cash, rates the driver.","driver":"Goes online, accepts ride offers, drives, collects cash, settles dues with the organisation, receives payouts.","system":"Prices rides, finds and offers drivers, keeps the ledger, runs scheduled jobs.","admin":"Organisation staff in the admin panel: approve drivers, watch rides, settle cash, pay drivers, handle support and safety."},"passenger_flow":[{"id":"P1","title":"Enable current location","actor":"passenger","what_happens":"The app asks for location permission and reads the phone's GPS. The backend checks the point is inside a service area.","api":"GET /zones/check?lat={lat}&lng={lng}","rules":["Rides can only start inside an active service zone (Gulshan & Banani, Dhanmondi, Uttara, Mirpur, Motijheel in the demo data)."],"status":"partial","note":"The zone check is built. Reading GPS is a mobile-app job (app not built)."},{"id":"P2","title":"Choose pickup and destination","actor":"passenger","what_happens":"Pickup defaults to the current location. The passenger picks or types the destination. A place copied from Google Maps (e.g. '23.7806, 90.4074') is turned into latitude and longitude by the app.","api":"No call yet: the points are sent with the quote in P3.","rules":["Each point is latitude, longitude and an optional name (up to 200 characters).","The pickup must be inside a service zone; the destination may be outside it."],"status":"partial","note":"The API takes coordinates and names. Pasting 'lat, lng' is supported in the admin 'Book a ride' drawer today. Reading a full Google Maps share link (https://maps.app.goo.gl/...) and place search need the app plus a geocoding provider (Google Places or Barikoi), not built."},{"id":"P3","title":"Search: see the fare and the drivers nearby","actor":"passenger","what_happens":"The passenger picks a vehicle type (Bike, Car, CNG). The system calculates the route distance and time, prices the ride from the live fare rule (including any surge) and counts the available drivers nearby.","api":"POST /quotes  { category_id, pickup: {lat, lng, label}, destination: {lat, lng, label} }","returns":["quote id","estimated fare and its breakdown","surge multiplier","number of available drivers nearby","quote expiry time"],"rules":["The fare is frozen in the quote: the passenger pays what they were shown (plus waiting time or a changed route).","Distance and time come from Google Routes when configured, otherwise from an estimate."],"status":"partial","note":"Built: fare, surge and the COUNT of nearby drivers. Not built: showing each nearby driver on the passenger's map (needs a privacy-safe 'nearby drivers' endpoint that returns approximate positions only)."},{"id":"P4","title":"Request the ride","actor":"passenger","what_happens":"The passenger confirms the quote, chooses cash and can add a pickup note or a promo code. The request goes to dispatch.","api":"POST /rides  { quote_id, payment_method: 'cash', pickup_note }   then optionally  POST /rides/{id}/promo  { code }","rules":["ONE active request per passenger: a second request is refused until the first is cancelled, completed or expired.","Only cash is enabled (setting payments.enabled_methods). Digital payments are not built."],"status":"built"},{"id":"P5","title":"Driver matching","actor":"system","what_happens":"Dispatch offers the ride to the NEAREST free driver with the right vehicle type. That driver has 15 seconds to accept. If they decline or don't answer, the next nearest driver gets the offer. The search widens from 1.5 km to 3 km to 5 km. With nobody after 3 minutes the request closes as 'no driver found'.","api":"GET /rides/{id}  (passenger watches the status: searching → matched)","rules":["A ride is offered to one driver at a time; a driver gets one offer at a time.","Only approved, online drivers with a fresh location and an active vehicle of that type are offered rides.","Staff can re-dispatch, assign a specific driver or cancel from the admin panel (Ride requests)."],"status":"built","about_choosing_a_driver":{"driver_picks_passenger":"Built: the driver sees the offer (pickup, destination, fare, distance) and accepts or declines it (see D4).","passenger_picks_driver":"Not built. Today the system picks the nearest driver automatically, which is faster and fairer. If you want passengers to choose, the change is: show 3–5 nearby drivers with name, rating, vehicle and ETA after the quote, the passenger taps one, and that driver alone gets the offer (if they decline or time out, the passenger chooses again). The one-active-request and one-offer-per-driver locks stay the same."}},{"id":"P6","title":"Driver assigned: track the driver","actor":"passenger","what_happens":"The passenger sees the driver's name, rating, vehicle and plate, and follows the driver's progress: on the way → arrived.","api":"GET /rides/{id}   (realtime channel 'ride:{id}' also announces each status change)","rules":["If the pickup PIN feature flag is on, the passenger reads a 4-digit PIN to the driver at pickup (GET /rides/{id}/pin)."],"status":"built"},{"id":"P7","title":"Cancel (the standard way)","actor":"passenger","what_happens":"Before the ride starts the passenger can cancel. The app first shows whether a fee applies, then cancels with a reason.","api":"GET /rides/{id}/cancel-preview   then   POST /rides/{id}/cancel  { reason }","rules":["Free while searching, and within 2 minutes of a driver being assigned.","Later, a cancellation fee applies (Bike 30, Car 50, CNG 40 in the demo fare rules). It is added to the passenger's next ride; the driver receives it minus the platform commission.","A ride that has started cannot be cancelled by the passenger.","After cancelling, the passenger is free to request again."],"status":"built"},{"id":"P8","title":"Ride in progress and completed","actor":"system","what_happens":"The driver starts the trip at pickup and completes it at the destination. The final fare is calculated from the frozen fare rule and the recorded route, time and waiting.","api":"GET /rides/{id}   then   GET /trips/{id}/receipt","rules":["SOS is available throughout the ride: POST /trips/{id}/sos alerts the safety team at once (with evidence upload)."],"status":"built"},{"id":"P9","title":"Pay the driver","actor":"passenger","what_happens":"The passenger pays the final fare in cash to the driver (fare minus any promo discount, plus any cancellation fee owed from earlier).","api":"GET /trips/{id}/receipt  (shows the amount to pay)","rules":["The driver confirms the cash in their app (D7). Unconfirmed cash is flagged to finance after 24 hours."],"status":"built","note":"bKash / Nagad / card payment is not built (needs merchant accounts); see docs/integrations/digital-payments.md."},{"id":"P10","title":"Rate and review the driver","actor":"passenger","what_happens":"The passenger gives 1–5 stars and an optional comment. The driver can rate the passenger the same way.","api":"POST /trips/{id}/rate  { score: 1-5, comment }","rules":["Once per trip, within 7 days of completion (setting ratings.window_days).","Ratings feed the driver's average rating. Staff can hide abusive comments (Ratings page, with a reason)."],"status":"built"},{"id":"P11","title":"Help after the ride","actor":"passenger","what_happens":"Lost item, overcharge or complaint: the passenger opens a support ticket. Staff can refund (approved by finance).","api":"POST /support/tickets  { tripId, category, subject, body }","status":"built"}],"driver_flow":[{"id":"D1","title":"Sign up and onboard","actor":"driver","what_happens":"The driver creates an account, fills in details, adds a vehicle and uploads documents (NID, driving licence, profile photo, registration, fitness, tax token, insurance; route permit for CNG), then submits the application.","api":"POST /onboarding/driver → PATCH /driver/details → POST /driver/vehicles → POST /driver/documents/upload-url + POST /driver/documents/{id}/complete → POST /driver/application/submit","status":"built"},{"id":"D2","title":"Approval by the organisation","actor":"admin","what_happens":"Operations reviews each document (approve or reject with a reason), verifies the vehicle and approves the driver. Staff can also create the driver and upload documents for them.","where":"Admin panel → Drivers → Review application; Documents queue","rules":["Expired documents suspend the driver automatically until renewed."],"status":"built"},{"id":"D3","title":"Go online","actor":"driver","what_happens":"The driver goes online. The app sends the driver's location every few seconds so dispatch knows who is nearby.","api":"POST /driver/availability  { online: true, lat, lng }   then   POST /driver/location  (batched points)","rules":["A driver whose location stops updating for 2 minutes is taken offline automatically."],"status":"built"},{"id":"D4","title":"Pick a passenger (accept an offer)","actor":"driver","what_happens":"The driver gets an offer showing the pickup, destination, fare and pickup distance, and has 15 seconds to accept or decline.","api":"GET /driver/offers/current   then   POST /driver/offers/{id}/accept   or   POST /driver/offers/{id}/reject","rules":["ONE pending offer and ONE active trip per driver: no new offers until the current trip ends or is cancelled.","If several drivers race to accept, exactly one wins; the others get 'offer no longer available'.","Declines and timeouts count towards the driver's acceptance rate."],"status":"built"},{"id":"D5","title":"Drive to the pickup and start","actor":"driver","what_happens":"On the way → arrived (the system checks the driver is near the pickup) → start the trip (entering the passenger's PIN when that feature is on).","api":"POST /driver/trips/{id}/arriving → POST /driver/trips/{id}/arrived → POST /driver/trips/{id}/start  { pin }","rules":["Waiting at pickup beyond the free minutes (3 in the demo rules) is charged per minute."],"status":"built"},{"id":"D6","title":"Cancel (the standard way)","actor":"driver","what_happens":"Before the trip starts the driver can cancel with a reason (e.g. passenger not reachable). The request closes and the passenger can request again.","api":"POST /driver/trips/{id}/cancel  { reason }","rules":["Cancellations count towards the driver's cancellation rate. Repeated late cancellations can lead to suspension by staff."],"status":"built"},{"id":"D7","title":"Complete the ride and collect cash","actor":"driver","what_happens":"At the destination the driver completes the trip. The app shows the amount to collect; the driver takes the cash and confirms it.","api":"POST /driver/trips/{id}/complete   then   POST /driver/trips/{id}/cash-collected","status":"built"},{"id":"D8","title":"See earnings and wallet","actor":"driver","what_happens":"The driver sees each trip's earning (fare minus platform commission) and their wallet: negative means they owe the organisation (cash they kept that includes the platform's share); positive means the organisation owes them.","api":"GET /driver/earnings   and   GET /driver/wallet","status":"built"},{"id":"D9","title":"Pay the organisation (cash dues)","actor":"driver","what_happens":"Because passengers pay cash to the driver, the driver holds the platform's commission. The driver deposits it by bKash, Nagad, bank or at the office; finance records the deposit and it clears the dues.","where":"Admin panel → Payments → Driver dues → Record deposit","rules":["Finance reconciles cash and deposits; differences raise an alert."],"status":"built"},{"id":"D10","title":"Get paid by the organisation (payouts)","actor":"admin","what_happens":"When a driver's wallet is positive (promo discounts the platform covered, incentives, cancellation fees), finance creates a weekly payout batch, a second finance person approves it, and the money is sent to the driver's verified bKash / Nagad / bank account and marked paid.","api":"Driver: PUT /driver/payout-account  { method, holder, ref }","where":"Admin panel → Payouts","rules":["Only balances of at least 500 are paid (setting payouts.minimum_amount).","The person who creates a batch cannot approve it (maker–checker).","Sending the money is manual today (bKash merchant portal or bank upload); automatic payout needs a provider API, see docs/integrations/payout-provider.md."],"status":"partial"}],"money_flow":{"summary":"Cash rides: the passenger pays the driver; the driver owes the organisation its share; the organisation pays the driver whatever it owes them. Every taka is recorded in a double-entry ledger that must always balance.","fare_formula":"fare = max(minimum fare, base + per_km × km + per_minute × minutes + waiting) × surge  + booking fee","who_gets_what":{"driver":"fare − platform commission (commission is a percentage of the fare, set per fare rule)","organisation":"platform commission + booking fee + commission share of cancellation fees","organisation_costs":"promo discounts (the platform funds them), driver incentives, approved refunds"},"demo_rates":{"bike":{"base":25,"per_km":12,"per_minute":1,"minimum":50,"booking_fee":0,"commission_pct":15,"cancellation_fee":30},"car":{"base":60,"per_km":30,"per_minute":3,"minimum":150,"booking_fee":10,"commission_pct":20,"cancellation_fee":50},"cng":{"base":40,"per_km":20,"per_minute":2,"minimum":90,"booking_fee":5,"commission_pct":18,"cancellation_fee":40}},"worked_examples":[{"case":"Bike, 6 km, 18 minutes, cash, no promo","fare":"25 + 6×12 + 18×1 = 115","passenger_pays_driver":115,"driver_earning":"115 − 15% (17.25) = 97.75","organisation_earns":17.25,"settlement":"The driver holds 115 but earned 97.75, so the driver wallet shows −17.25: the driver deposits 17.25 to the organisation (D9)."},{"case":"Same ride with promo WELCOME50 (platform pays the 50)","fare":115,"passenger_pays_driver":65,"driver_earning":97.75,"organisation_earns":"17.25 commission − 50 promo = −32.75 (a marketing cost)","settlement":"The driver holds 65 but earned 97.75, so the wallet shows +32.75: the organisation pays the driver 32.75 in the next payout (D10)."},{"case":"Car, 8 km, 25 minutes, cash","fare":"60 + 8×30 + 25×3 = 375, plus booking fee 10 = 385","passenger_pays_driver":385,"driver_earning":"375 − 20% (75) = 300","organisation_earns":"75 commission + 10 booking fee = 85","settlement":"Driver wallet −85: deposited to the organisation."}],"organisation_profit":{"revenue":["Commission on every completed ride","Booking fee (car and CNG)","Commission share of passenger cancellation fees"],"minus":["Promotions the platform funds","Driver incentives (approved adjustments)","Refunds","Running costs outside this system (maps, SMS, hosting, staff)"],"where_to_see_it":"Admin panel → Dashboard (gross bookings, platform revenue, contribution per ride), Analytics → Economics and Finance, Ledger (platform accounts)."},"controls":["Fares are frozen at quote time.","Refunds and adjustments need a second approver from 5,000 up (setting finance.dual_approval_threshold).","The ledger is checked every night; any imbalance raises an alert.","Every staff action needs a reason and is written to the audit log."]},"locks_and_fairness":{"passenger":"One active request at a time. To book another ride, cancel the current one (standard cancel, fee rules apply) or wait until it completes or expires.","driver":"One pending offer and one active trip at a time. A new offer comes only after the current trip is completed or cancelled.","race_safety":"If many drivers accept the same ride at once, exactly one gets it (tested with 50 drivers at once)."},"not_built_yet":[{"item":"Passenger and driver mobile apps","note":"The API they need is built; see docs/spec/05-api.md."},{"item":"Passenger chooses a specific driver","note":"Today: automatic nearest-driver dispatch, or staff assign a driver. Design for passenger choice is in P5."},{"item":"Nearby drivers drawn on the passenger's map","note":"Today: the quote returns the count of nearby drivers."},{"item":"Google Maps share links and place search","note":"Needs the app and a geocoding provider (Google Places or Barikoi)."},{"item":"bKash / Nagad / card payment by the passenger","note":"Needs merchant accounts; see docs/integrations/digital-payments.md."},{"item":"Automatic payouts to drivers","note":"Today finance sends payouts by hand and marks them paid; see docs/integrations/payout-provider.md."}]}</script>

ks whom","c":[{"t":"Driver picks passenger: Built: the driver sees the offer (pickup, destination, fare, distance) and accepts or declines it (see D4)."},{"t":"Passenger picks driver: Not built. Today the system picks the nearest driver automatically, which is faster and fairer. If you want passengers to choose, the change is: show 3–5 nearby drivers with name, rating, vehicle and ETA after the quote, the passenger taps one, and that driver alone gets the offer (if they decline or time out, the passenger chooses again). The one-active-request and one-offer-per-driver locks stay the same."}]}]},{"t":"P6. Driver assigned: track the driver","s":"built","c":[{"t":"What happens","c":[{"t":"The passenger sees the driver's name, rating, vehicle and plate, and follows the driver's progress: on the way → arrived."}]},{"t":"API call","c":[{"t":"GET /rides/{id}   (realtime channel 'ride:{id}' also announces each status change)"}]},{"t":"Rules","c":[{"t":"If the pickup PIN feature flag is on, the passenger reads a 4-digit PIN to the driver at pickup (GET /rides/{id}/pin)."}]}]},{"t":"P7. Cancel (the standard way)","s":"built","c":[{"t":"What happens","c":[{"t":"Before the ride starts the passenger can cancel. The app first shows whether a fee applies, then cancels with a reason."}]},{"t":"API call","c":[{"t":"GET /rides/{id}/cancel-preview   then   POST /rides/{id}/cancel  { reason }"}]},{"t":"Rules","c":[{"t":"Free while searching, and within 2 minutes of a driver being assigned."},{"t":"Later, a cancellation fee applies (Bike 30, Car 50, CNG 40 in the demo fare rules). It is added to the passenger's next ride; the driver receives it minus the platform commission."},{"t":"A ride that has started cannot be cancelled by the passenger."},{"t":"After cancelling, the passenger is free to request again."}]}]},{"t":"P8. Ride in progress and completed","s":"built","c":[{"t":"What happens","c":[{"t":"The driver starts the trip at pickup and completes it at the destination. The final fare is calculated from the frozen fare rule and the recorded route, time and waiting."}]},{"t":"API call","c":[{"t":"GET /rides/{id}   then   GET /trips/{id}/receipt"}]},{"t":"Rules","c":[{"t":"SOS is available throughout the ride: POST /trips/{id}/sos alerts the safety team at once (with evidence upload)."}]}]},{"t":"P9. Pay the driver","s":"built","c":[{"t":"What happens","c":[{"t":"The passenger pays the final fare in cash to the driver (fare minus any promo discount, plus any cancellation fee owed from earlier)."}]},{"t":"API call","c":[{"t":"GET /trips/{id}/receipt  (shows the amount to pay)"}]},{"t":"Rules","c":[{"t":"The driver confirms the cash in their app (D7). Unconfirmed cash is flagged to finance after 24 hours."}]},{"t":"Note","c":[{"t":"bKash / Nagad / card payment is not built (needs merchant accounts); see docs/integrations/digital-payments.md."}]}]},{"t":"P10. Rate and review the driver","s":"built","c":[{"t":"What happens","c":[{"t":"The passenger gives 1–5 stars and an optional comment. The driver can rate the passenger the same way."}]},{"t":"API call","c":[{"t":"POST /trips/{id}/rate  { score: 1-5, comment }"}]},{"t":"Rules","c":[{"t":"Once per trip, within 7 days of completion (setting ratings.window_days)."},{"t":"Ratings feed the driver's average rating. Staff can hide abusive comments (Ratings page, with a reason)."}]}]},{"t":"P11. Help after the ride","s":"built","c":[{"t":"What happens","c":[{"t":"Lost item, overcharge or complaint: the passenger opens a support ticket. Staff can refund (approved by finance)."}]},{"t":"API call","c":[{"t":"POST /support/tickets  { tripId, category, subject, body }"}]}]}]},{"t":"Driver journey","c":[{"t":"D1. Sign up and onboard","s":"built","c":[{"t":"What happens","c":[{"t":"The driver creates an account, fills in details, adds a vehicle and uploads documents (NID, driving licence, profile photo, registration, fitness, tax token, insurance; route permit for CNG), then submits the application."}]},{"t":"API call","c":[{"t":"POST /onboarding/driver → PATCH /driver/details → POST /driver/vehicles → POST /driver/documents/upload-url + POST /driver/documents/{id}/complete → POST /driver/application/submit"}]}]},{"t":"D2. Approval by the organisation","s":"built","c":[{"t":"What happens","c":[{"t":"Operations reviews each document (approve or reject with a reason), verifies the vehicle and approves the driver. Staff can also create the driver and upload documents for them."}]},{"t":"Where in the admin panel","c":[{"t":"Admin panel → Drivers → Review application; Documents queue"}]},{"t":"Rules","c":[{"t":"Expired documents suspend the driver automatically until renewed."}]}]},{"t":"D3. Go online","s":"built","c":[{"t":"What happens","c":[{"t":"The driver goes online. The app sends the driver's location every few seconds so dispatch knows who is nearby."}]},{"t":"API call","c":[{"t":"POST /driver/availability  { online: true, lat, lng }   then   POST /driver/location  (batched points)"}]},{"t":"Rules","c":[{"t":"A driver whose location stops updating for 2 minutes is taken offline automatically."}]}]},{"t":"D4. Pick a passenger (accept an offer)","s":"built","c":[{"t":"What happens","c":[{"t":"The driver gets an offer showing the pickup, destination, fare and pickup distance, and has 15 seconds to accept or decline."}]},{"t":"API call","c":[{"t":"GET /driver/offers/current   then   POST /driver/offers/{id}/accept   or   POST /driver/offers/{id}/reject"}]},{"t":"Rules","c":[{"t":"ONE pending offer and ONE active trip per driver: no new offers until the current trip ends or is cancelled."},{"t":"If several drivers race to accept, exactly one wins; the others get 'offer no longer available'."},{"t":"Declines and timeouts count towards the driver's acceptance rate."}]}]},{"t":"D5. Drive to the pickup and start","s":"built","c":[{"t":"What happens","c":[{"t":"On the way → arrived (the system checks the driver is near the pickup) → start the trip (entering the passenger's PIN when that feature is on)."}]},{"t":"API call","c":[{"t":"POST /driver/trips/{id}/arriving → POST /driver/trips/{id}/arrived → POST /driver/trips/{id}/start  { pin }"}]},{"t":"Rules","c":[{"t":"Waiting at pickup beyond the free minutes (3 in the demo rules) is charged per minute."}]}]},{"t":"D6. Cancel (the standard way)","s":"built","c":[{"t":"What happens","c":[{"t":"Before the trip starts the driver can cancel with a reason (e.g. passenger not reachable). The request closes and the passenger can request again."}]},{"t":"API call","c":[{"t":"POST /driver/trips/{id}/cancel  { reason }"}]},{"t":"Rules","c":[{"t":"Cancellations count towards the driver's cancellation rate. Repeated late cancellations can lead to suspension by staff."}]}]},{"t":"D7. Complete the ride and collect cash","s":"built","c":[{"t":"What happens","c":[{"t":"At the destination the driver completes the trip. The app shows the amount to collect; the driver takes the cash and confirms it."}]},{"t":"API call","c":[{"t":"POST /driver/trips/{id}/complete   then   POST /driver/trips/{id}/cash-collected"}]}]},{"t":"D8. See earnings and wallet","s":"built","c":[{"t":"What happens","c":[{"t":"The driver sees each trip's earning (fare minus platform commission) and their wallet: negative means they owe the organisation (cash they kept that includes the platform's share); positive means the organisation owes them."}]},{"t":"API call","c":[{"t":"GET /driver/earnings   and   GET /driver/wallet"}]}]},{"t":"D9. Pay the organisation (cash dues)","s":"built","c":[{"t":"What happens","c":[{"t":"Because passengers pay cash to the driver, the driver holds the platform's commission. The driver deposits it by bKash, Nagad, bank or at the office; finance records the deposit and it clears the dues."}]},{"t":"Where in the admin panel","c":[{"t":"Admin panel → Payments → Driver dues → Record deposit"}]},{"t":"Rules","c":[{"t":"Finance reconciles cash and deposits; differences raise an alert."}]}]},{"t":"D10. Get paid by the <script>
const D = JSON.parse(document.getElementById("data").textContent);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v); // real handlers, not text
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
const STATUS = { built: "Built", partial: "Partly built", not_built: "Not built" };
const badge = (s) => s ? el("span", { class: "badge " + s, title: D.status_legend[s] }, STATUS[s]) : null;
const section = (label, content) => content ? [el("h4", {}, label), content] : [];
const list = (items) => el("ul", {}, items.map((i) => el("li", {}, i)));
const codeLine = (t) => el("p", {}, el("code", {}, t));

document.getElementById("title").textContent = D.title;
document.getElementById("how").textContent = D.how_to_read;
document.getElementById("important").textContent = D.important;

function stepView(s, prefix) {
  const d = el("details", {});
  d.append(el("summary", {},
    el("span", { class: "title" }, s.title),
    el("span", { class: "who", style: `color:var(--${({passenger:"pax",driver:"drv",system:"sys",admin:"adm"})[s.actor]})` }, s.actor),
    badge(s.status),
    el("span", { class: "chev" }, "›")));
  const body = el("div", { class: "body" });
  if (s.what_happens) body.append(...section("What happens", el("p", {}, s.what_happens)));
  if (s.api) body.append(...section("API call", codeLine(s.api)));
  if (s.where) body.append(...section("Where (admin panel)", el("p", {}, s.where)));
  if (s.returns) body.append(...section("Returns", list(s.returns)));
  if (s.rules) body.append(...section("Rules the system enforces", list(s.rules)));
  if (s.about_choosing_a_driver) {
    const a = s.about_choosing_a_driver;
    body.append(...section("Who picks whom",
      el("div", { class: "box" }, el("b", {}, "Driver picks passenger: "), a.driver_picks_passenger, el("br"), el("br"), el("b", {}, "Passenger picks driver: "), a.passenger_picks_driver)));
  }
  if (s.note) body.append(el("div", { class: "box warn" }, s.note));
  d.append(body);
  return el("li", { class: "step" }, el("span", { class: "dot " + s.actor }, s.id), d);
}

function timeline(steps) {
  return el("ol", { class: "timeline" }, steps.map((s) => stepView(s)));
}

function expandControls(root) {
  return el("div", { class: "toolbar" },
    el("button", { class: "btn", onclick: () => root.querySelectorAll("details").forEach((d) => (d.open = true)) }, "Expand all"),
    el("button", { class: "btn", onclick: () => root.querySelectorAll("details").forEach((d) => (d.open = false)) }, "Collapse all"));
}

const legend = () => el("div", { class: "legend" }, Object.keys(STATUS).map((k) => el("span", {}, badge(k), " ", D.status_legend[k])));

const VIEWS = {
  overview() {
    const root = el("div");
    root.append(legend());
    root.append(el("h2", {}, "The whole journey"));
    const chips = [["Passenger enables location", "pax"], ["Picks pickup & destination", "pax"], ["Sees fare & nearby drivers", "pax"], ["Requests ride", "pax"],
      ["System offers to nearest driver", "sys"], ["Driver accepts", "drv"], ["Driver arrives & starts", "drv"], ["Ride completes", "drv"],
      ["Passenger pays cash", "pax"], ["Driver confirms cash", "drv"], ["Passenger rates driver", "pax"], ["Driver pays organisation's share", "drv"], ["Organisation pays driver any balance", "adm"]];
    const flow = el("div", { class: "overview" });
    chips.forEach(([t, c], i) => { flow.append(el("span", { class: "chip", style: `background:var(--${c})` }, `${i + 1}. ${t}`)); });
    root.append(flow);
    root.append(el("h2", {}, "One-at-a-time rules"));
    root.append(el("div", { class: "cards" },
      el("div", { class: "card" }, el("h3", {}, "Passenger"), D.locks_and_fairness.passenger),
      el("div", { class: "card" }, el("h3", {}, "Driver"), D.locks_and_fairness.driver),
      el("div", { class: "card" }, el("h3", {}, "Race safety"), D.locks_and_fairness.race_safety)));
    root.append(el("h2", {}, "Not built yet"));
    root.append(el("table", {}, el("tbody", {}, D.not_built_yet.map((n) => el("tr", {}, el("td", {}, el("b", {}, n.item)), el("td", {}, n.note))))));
    return root;
  },
  mindmap() {
    const tree = JSON.parse(document.getElementById("tree").textContent);
    const root = el("div");
    const wrap = el("div", { class: "mm-wrap" });
    const mm = el("div", { class: "mm" });
    const build = (n, depth, top) => {
      const has = Boolean(n.c && n.c.length);
      const li = el("li", { "data-top": String(top) });
      if (depth <= 1 || !has) li.classList.add("open"); // the root and its branches start open; steps start folded
      const nd = el(has ? "button" : "div", { class: `nd d${Math.min(depth, 3)} ${has ? "has" : "lf"}` });
      if (has) nd.append(el("span", { class: "cv" }, "›"));
      nd.append(el("span", {}, n.t));
      if (n.s) nd.append(el("span", { class: "tg " + n.s }, STATUS[n.s]));
      li.append(nd);
      if (has) {
        const ul = el("ul", {}, n.c.map((k, i) => build(k, depth + 1, depth === 0 ? i : top)));
        li.append(ul);
        nd.addEventListener("click", () => { li.classList.toggle("open"); ul.style.display = li.classList.contains("open") ? "" : "none"; });
        if (!li.classList.contains("open")) ul.style.display = "none";
      }
      return li;
    };
    mm.append(el("ul", {}, build(tree, 0, 0)));
    wrap.append(mm);
    const setAll = (open) => {
      mm.querySelectorAll("li").forEach((li) => {
        const ul = li.querySelector(":scope > ul");
        if (!ul) return;
        li.classList.toggle("open", open);
        ul.style.display = open ? "" : "none";
      });
      mm.querySelector("li").classList.add("open"); mm.querySelector("li > ul").style.display = "";
    };
    root.append(el("div", { class: "exp" },
      el("button", { class: "btn", onclick: () => setAll(true) }, "Expand all"),
      el("button", { class: "btn", onclick: () => setAll(false) }, "Collapse all"),
      el("span", {}, "Click a branch to fold or unfold it. Import into a mind-map app: "),
      el("a", { href: "ride-workflow.mindmap.md", download: "" }, "Markdown (Markmap, XMind, Obsidian)"), " · ",
      el("a", { href: "ride-workflow.opml", download: "" }, "OPML (XMind, MindNode, FreeMind)")));
    root.append(wrap);
    return root;
  },
  passenger() { const root = el("div"); root.append(legend(), expandControls(root), timeline(D.passenger_flow)); return root; },
  driver() { const root = el("div"); root.append(legend(), expandControls(root), timeline(D.driver_flow)); return root; },
  money() {
    const m = D.money_flow, root = el("div");
    root.append(el("p", {}, m.summary));
    root.append(el("h2", {}, "Who pays whom (cash ride)"));
    root.append(el("div", { class: "flow" },
      el("span", { class: "node", style: "background:var(--pax)" }, "Passenger"),
      el("span", { class: "arrow" }, "pays the full fare in cash →"),
      el("span", { class: "node", style: "background:var(--drv)" }, "Driver"),
      el("span", { class: "arrow" }, "deposits the commission (bKash / Nagad / bank / office) →"),
      el("span", { class: "node", style: "background:var(--adm)" }, "Organisation")));
    root.append(el("div", { class: "flow" },
      el("span", { class: "node", style: "background:var(--adm)" }, "Organisation"),
      el("span", { class: "arrow" }, "pays what it owes (promo discounts, incentives, cancellation fees) in the weekly payout →"),
      el("span", { class: "node", style: "background:var(--drv)" }, "Driver")));
    root.append(el("div", { class: "cards" },
      el("div", { class: "card" }, el("h3", {}, "Fare"), el("code", {}, m.fare_formula)),
      el("div", { class: "card" }, el("h3", {}, "Driver gets"), m.who_gets_what.driver),
      el("div", { class: "card" }, el("h3", {}, "Organisation gets"), m.who_gets_what.organisation),
      el("div", { class: "card" }, el("h3", {}, "Organisation pays for"), m.who_gets_what.organisation_costs)));
    root.append(el("h2", {}, "Demo rates"));
    root.append(el("table", {}, el("thead", {}, el("tr", {}, ["Vehicle", "Base", "Per km", "Per min", "Minimum", "Booking fee", "Commission", "Cancel fee"].map((h) => el("th", {}, h)))),
      el("tbody", {}, Object.entries(m.demo_rates).map(([k, r]) => el("tr", {}, el("td", {}, el("b", {}, k.toUpperCase())), el("td", {}, r.base), el("td", {}, r.per_km), el("td", {}, r.per_minute), el("td", {}, r.minimum), el("td", {}, r.booking_fee), el("td", {}, r.commission_pct + "%"), el("td", {}, r.cancellation_fee))))));
    root.append(el("h2", {}, "Worked examples (BDT)"));
    m.worked_examples.forEach((e) => root.append(el("div", { class: "card ex" }, el("h3", {}, e.case),
      el("dl", {}, ["fare", "passenger_pays_driver", "driver_earning", "organisation_earns", "settlement"].flatMap((k) => e[k] === undefined ? [] :
        [el("dt", {}, k.replaceAll("_", " ")), el("dd", {}, String(e[k]))])))));
    root.append(el("h2", {}, "How the organisation profits"));
    const p = m.organisation_profit;
    root.append(el("div", { class: "cards" },
      el("div", { class: "card" }, el("h3", {}, "Revenue"), list(p.revenue)),
      el("div", { class: "card" }, el("h3", {}, "Minus"), list(p.minus)),
      el("div", { class: "card" }, el("h3", {}, "Where to see it"), p.where_to_see_it)));
    root.append(el("h2", {}, "Controls"), list(m.controls));
    return root;
  },
};

const tabs = [["overview", "Overview"], ["mindmap", "Mind map"], ["passenger", "Passenger journey"], ["driver", "Driver journey"], ["money", "Money & profit"]];
const tabBar = document.getElementById("tabs"), main = document.getElementById("main");
function show(id) {
  tabBar.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.id === id)));
  main.replaceChildren(VIEWS[id]());
  history.replaceState(null, "", "#" + id);
}
tabs.forEach(([id, label]) => tabBar.append(el("button", { class: "tab", role: "tab", "data-id": id, onclick: () => show(id) }, label)));
show(VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "overview");
</script>
